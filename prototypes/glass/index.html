<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API-free · 统一面板</title>
<link rel="icon" href="../porcelain/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="glass.css">
<style>
  html,body{height:100%}
  .side{
    position:fixed; z-index:60; left:16px; top:16px; bottom:16px; width:218px;
    display:flex; flex-direction:column; gap:2px; padding:18px 14px;
    border-radius:22px;
    background:var(--glass-strong);
    border:1px solid var(--glass-border);
    box-shadow:var(--glass-inner), var(--card-shadow);
    backdrop-filter:blur(26px) saturate(1.7); -webkit-backdrop-filter:blur(26px) saturate(1.7);
  }
  .brand{display:flex; align-items:center; gap:10px; padding:2px 8px 18px}
  .brand svg{width:27px;height:27px;display:block}
  .brand b{font-size:14.5px; letter-spacing:-.01em; display:block; line-height:1.25}
  .brand small{font-size:10.5px; color:var(--faint); font-weight:600; letter-spacing:.04em}
  .grp{font-size:10.5px; color:var(--faint); font-weight:700; letter-spacing:.1em; padding:12px 10px 5px}
  .nitem{
    display:flex; align-items:center; gap:9px; width:100%;
    border:0; background:transparent; color:var(--muted); text-align:left;
    font:inherit; font-size:13.5px; font-weight:600; padding:8px 10px; border-radius:12px; cursor:pointer;
    transition:color .15s ease-out, background .15s ease-out;
  }
  .nitem svg{flex:none; opacity:.75}
  .nitem:hover{color:var(--text); background:rgba(255,255,255,.55)}
  .nitem.on{color:var(--accent); background:rgba(255,255,255,.92); box-shadow:0 1px 5px rgba(168,138,82,.2)}
  .nitem.on svg{opacity:1}
  .nitem .dot{width:7px;height:7px;border-radius:50%;margin-left:auto;flex:none}
  .nitem .dot.run{background:var(--ok)} .nitem .dot.stop{background:#c9c0aa}
  .side .spacer{flex:1}
  .mocktag{font-size:10.5px; color:var(--faint); text-align:center; border:1px dashed rgba(141,127,97,.4); border-radius:var(--r-ctl); padding:5px 0}
  .stage{margin-left:250px; height:100dvh}
  .stage iframe{display:block; width:100%; height:100%; border:0}
  @media (max-width:1100px){
    .side{display:none}
    .stage{margin-left:0}
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<aside class="side">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect x="1.5" y="1.5" width="29" height="29" rx="9" fill="#ffffff" stroke="#3c331f" stroke-width="1.8"/>
      <circle cx="8.7" cy="8.7" r="2.5" fill="none" stroke="#3c331f" stroke-width="1.6"/>
      <circle cx="23.3" cy="8.7" r="2.5" fill="none" stroke="#3c331f" stroke-width="1.6"/>
      <circle cx="8.7" cy="23.3" r="2.5" fill="none" stroke="#3c331f" stroke-width="1.6"/>
      <circle cx="23.3" cy="23.3" r="2.5" fill="none" stroke="#3c331f" stroke-width="1.6"/>
      <path d="M10.4 10.4 L14 14 M21.6 10.4 L18 14 M10.4 21.6 L14 18 M21.6 21.6 L18 18" stroke="#3c331f" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="16" cy="16" r="2.9" fill="#2f6bd8"/>
    </svg>
    <div><b>API-free</b><small>统一面板 · 玻璃</small></div>
  </div>
  <nav id="nav">
    <button class="nitem on" data-page="overview"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="5.4" height="5.4" rx="1.2"/><rect x="9.1" y="1.5" width="5.4" height="5.4" rx="1.2"/><rect x="1.5" y="9.1" width="5.4" height="5.4" rx="1.2"/><rect x="9.1" y="9.1" width="5.4" height="5.4" rx="1.2"/></svg>总览</button>
    <button class="nitem" data-page="stats"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 13.5v-5"/><path d="M8 13.5v-9"/><path d="M13 13.5v-6.5"/></svg>统计</button>
    <button class="nitem" data-page="logs"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4h11"/><path d="M2.5 8h11"/><path d="M2.5 12h7"/></svg>日志</button>
    <button class="nitem" data-page="settings"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 5h11"/><circle cx="6" cy="5" r="1.8"/><path d="M2.5 11h11"/><circle cx="10.5" cy="11" r="1.8"/></svg>设置</button>
  </nav>
  <div class="grp">服务</div>
  <nav id="svcNav">
    <button class="nitem" data-page="workbuddy">WorkBuddy-free<span class="dot run"></span></button>
    <button class="nitem" data-page="qoder">Qoder-free<span class="dot run"></span></button>
    <button class="nitem" data-page="cline">Cline-free<span class="dot run"></span></button>
    <button class="nitem" data-page="cmdgo">cmdgo-bridge<span class="dot stop"></span></button>
  </nav>
  <div class="spacer"></div>
  <div class="mocktag">M0 原型 · 示例数据</div>
</aside>

<div class="stage"><iframe id="frame" src="overview.html" title="content"></iframe></div>

<script>
  var PAGES = {
    overview:  '总览',
    stats:     '统计',
    logs:      '日志',
    settings:  '设置',
    qoder:     'Qoder-free',
    workbuddy: 'WorkBuddy-free',
    cline:     'Cline-free',
    cmdgo:     'cmdgo-bridge'
  };
  var frame = document.getElementById('frame');
  var current = null;

  function setPage(p) {
    if (!PAGES[p] || p === current) return;
    current = p;
    frame.src = p + '.html';
    document.querySelectorAll('#nav .nitem, #svcNav .nitem').forEach(function (b) {
      b.classList.toggle('on', b.dataset.page === p);
    });
    var url = new URL(location);
    url.searchParams.set('page', p);
    history.replaceState(null, '', url);
  }

  document.getElementById('nav').addEventListener('click', function (e) {
    var b = e.target.closest('.nitem'); if (b) setPage(b.dataset.page);
  });
  document.getElementById('svcNav').addEventListener('click', function (e) {
    var b = e.target.closest('.nitem'); if (b) setPage(b.dataset.page);
  });
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'nav' && PAGES[e.data.target]) setPage(e.data.target);
  });
  setPage(new URLSearchParams(location.search).get('page') || 'overview');
</script>
</body>
</html>
