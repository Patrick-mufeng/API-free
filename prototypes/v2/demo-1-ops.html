<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>指挥台 · API-free</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
/* ===========================================================================
   D1 指挥台 Ops — 浅色精密仪表
   设计读数：dashboard（不是 landing page），面向本机运维自己。
     DESIGN_VARIANCE 3  · 对称 12 栏网格，不玩非对称
     MOTION_INTENSITY 4 · 只有反馈与状态类动效，全部 <=180ms
     VISUAL_DENSITY  9  · Cockpit：细线分隔、不用卡片盒、数据单元用等宽数字
   结构靠细线 + 网格 + 字号阶梯，不靠阴影与圆角盒子。
   =========================================================================== */
:root{
  --paper:#FFFFFF; --sunken:#F7F6F4; --ink:#16181A; --ink-2:#3D3B38;
  --line:#E7E5E1; --line-2:#F0EEEB; --muted:#8A857E; --muted-2:#A8A39B;
  --accent:#2E64F0; --ok:#1F9D5B; --warn:#C98A0B; --err:#CE3B2C;
  --rail:56px; --topbar:52px;
  --mono:var(--font-mono); --sans:var(--font-sans);
  /* 形状阶梯：只有 3 档，全站一致 */
  --r-sm:6px; --r-md:9px; --r-lg:12px;
  /* 动效令牌 */
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease:cubic-bezier(.4,0,.2,1);
  --dur-press:110ms; --dur-hover:140ms; --dur-state:180ms; --dur-view:150ms;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 13px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
h1,h2,h3,h4{margin:0;font-weight:500}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.microlabel{font-size:10.5px;letter-spacing:.085em;text-transform:uppercase;color:var(--muted)}

/* ---- 左侧图标栏 ---- */
.rail{position:fixed;inset:0 auto 0 0;width:var(--rail);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding:12px 0 14px;background:var(--paper);z-index:5}
.rail .brand{width:30px;height:30px;color:var(--ink);margin-bottom:16px}
.rail .brand svg{display:block;width:100%;height:100%}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail .ni{width:38px;height:38px;display:grid;place-items:center;border-radius:var(--r-md);color:var(--muted-2);position:relative;
  transition:background-color var(--dur-hover) ease, color var(--dur-hover) ease}
@media (hover:hover) and (pointer:fine){ .rail .ni:hover{color:var(--ink-2);background:var(--sunken)} }
.rail .ni.on{color:var(--accent);background:#EEF3FE}
.rail .ni.on::before{content:'';position:absolute;left:-12px;top:11px;width:2px;height:16px;border-radius:2px;background:var(--accent)}
.rail .svcs{margin-top:auto;display:flex;flex-direction:column;gap:6px;align-items:center}
.rail .svcs a{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;position:relative;
  transition:opacity var(--dur-hover) ease}
@media (hover:hover) and (pointer:fine){ .rail .svcs a:hover{opacity:.72} }
.rail .svcs img{width:22px;height:22px;border-radius:6px;display:block}
.rail .svcs a::after{content:'';position:absolute;right:-3px;bottom:3px;width:7px;height:7px;border-radius:50%;
  background:var(--ok);box-shadow:0 0 0 2px var(--paper)}
.rail .svcs a.off{filter:grayscale(1) opacity(.55)}
.rail .svcs a.off::after{background:var(--muted)}

/* ---- 顶栏 ---- */
.top{position:fixed;top:0;left:var(--rail);right:0;height:var(--topbar);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 24px;background:rgba(255,255,255,.86);
  backdrop-filter:blur(12px);z-index:4}
.top h1{font-size:14.5px;font-weight:600;letter-spacing:-.005em}
.top .sep{width:1px;height:18px;background:var(--line)}
.top .meta{font-size:11.5px;color:var(--muted)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:14px}
.cmtog{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;font-size:11px}
.cmtog span{padding:3.5px 9px;color:var(--muted);transition:background-color var(--dur-state) var(--ease-out),color var(--dur-state) var(--ease-out)}
.cmtog span.on{background:var(--ink);color:#fff}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
/* 唯一的循环动效：运行指示的呼吸。它表达「在线且是活的」，不是装饰。 */
@media (prefers-reduced-motion: no-preference){ .live i{animation:pulse 2.4s var(--ease) infinite} }
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---- 主体：12 栏网格，铺满整宽（之前 max-width 1560 在 1920 下留了 304px 死白） ---- */
.stage{margin-left:var(--rail);padding-top:var(--topbar);min-height:100%}
.wrap{padding:22px 24px 30px}
.grid12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;align-items:start}
.s7{grid-column:span 7} .s5{grid-column:span 5} .s4{grid-column:span 4} .s3{grid-column:span 3}
.s12{grid-column:span 12}
.rowgap{margin-top:22px}

/* 视图切换：唯一的目的=避免内容瞬移（preventing a jarring change）。150ms，只做透明度 + 3px。 */
@media (prefers-reduced-motion: no-preference){
  .view-enter{animation:viewIn var(--dur-view) var(--ease-out)}
  @keyframes viewIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
}

/* ---- KPI 带 ---- */
.band{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.band .k{padding:14px 20px 15px;border-right:1px solid var(--line)}
.band .k:last-child{border-right:0}
.band .k .v{font-size:29px;font-weight:500;letter-spacing:-.022em;line-height:1.12;margin-top:8px}
.band .k .v small{font-size:13px;font-weight:400;color:var(--muted);margin-left:5px;letter-spacing:0}
.band .k .s{font-size:11.5px;color:var(--muted);margin-top:5px}
.band .k .d{font-size:11.5px;color:var(--ok);margin-top:5px}
.band .k .d.flat{color:var(--muted)}

/* ---- 区块 ---- */
.sect{border-top:1px solid var(--ink);padding-top:13px}
.sect > header{display:flex;align-items:baseline;gap:10px;margin-bottom:13px}
.sect > header h2{font-size:12px;letter-spacing:.02em;font-weight:600}
.sect > header .sub{font-size:11px;color:var(--muted)}
.sect > header .sp{margin-left:auto;display:flex;align-items:center;gap:10px}

/* ---- 服务表 ---- */
.svrows{border-top:1px solid var(--line)}
.svhead,.svrow{display:grid;align-items:center;gap:14px;padding:0 6px}
.svhead{grid-template-columns:26px minmax(0,1.5fr) 86px 62px 62px 84px 62px 104px 78px 46px;
  padding-top:0;padding-bottom:7px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.svhead span.n{text-align:right}
.svrow{grid-template-columns:26px minmax(0,1.5fr) 86px 62px 62px 84px 62px 104px 78px 46px;
  padding-top:10px;padding-bottom:10px;border-bottom:1px solid var(--line-2);
  transition:background-color var(--dur-hover) ease}
@media (hover:hover) and (pointer:fine){ .svrow:hover{background:#FAF9F7} }
.svrow img{width:22px;height:22px;border-radius:6px;display:block}
.svrow .nm{font-weight:500;font-size:13px}
.svrow .sub{font-size:11px;color:var(--muted);margin-top:1px}
.svrow .cell{font-size:12px;color:var(--ink-2)}
.svrow .n{text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.svrow .n.zero{color:var(--muted-2)}
.sparkbar{display:block;height:22px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2);white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.ok{color:var(--ok)} .chip.off{color:var(--muted)} .chip.warn{color:var(--warn)} .chip.err{color:var(--err)}
/* 开关：旋钮位置是 transform，回弹用强 ease-out */
.sw{width:34px;height:19px;border-radius:10px;background:var(--ok);position:relative;justify-self:end;cursor:pointer;
  transition:background-color var(--dur-state) var(--ease-out)}
.sw::after{content:'';position:absolute;top:2px;right:2px;width:15px;height:15px;border-radius:50%;background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.18);transition:transform var(--dur-state) var(--ease-out)}
.sw.off{background:#D8D4CF}
.sw.off::after{transform:translateX(-15px)}

/* ---- 图表 ---- */
.chartbox{position:relative}
.chartbox svg{display:block;width:100%;overflow:visible}
.chartbox .axis{font-size:9.5px;fill:var(--muted-2);font-family:var(--sans)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.legend i{width:8px;height:8px;border-radius:2px}
.note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.55}
.sampletag{display:inline-block;padding:1.5px 7px;border-radius:5px;background:#FFF3D6;color:#8A6100;font-size:10.5px}
/* 图表悬停读数：120ms 淡入，跟随鼠标用 transform（不触发重排）。
   注意：这层必须放在图表容器【外面】—— autoChart 会用 innerHTML 重画容器，放里面会被冲掉。 */
.chartwrap{position:relative}
.crossline{position:absolute;top:0;bottom:0;width:1px;background:var(--muted-2);opacity:0;pointer-events:none;
  transition:opacity 120ms var(--ease-out)}
.tip{position:absolute;top:6px;pointer-events:none;background:#fff;border:1px solid var(--line);
  border-radius:var(--r-sm);padding:7px 9px;box-shadow:0 4px 14px rgba(20,24,32,.10);opacity:0;
  transition:opacity 120ms var(--ease-out);white-space:nowrap;z-index:2}
.tip .d{font-size:10.5px;color:var(--muted);margin-bottom:4px}
.tip .r{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-2);line-height:1.7}
.tip .r i{width:7px;height:7px;border-radius:2px;flex:none}
.tip .r b{margin-left:auto;font-family:var(--mono);font-weight:400}

/* ---- 账号池 ---- */
.acct{display:flex;flex-direction:column;gap:12px}
.acct .r{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:11px;align-items:center}
.acct .r img{width:20px;height:20px;border-radius:5px}
.acct .nm{font-size:12.5px}
.acct .sub{font-size:11px;color:var(--muted);margin-top:1px}
.acct .v{font-family:var(--mono);font-size:12px;color:var(--ink-2);text-align:right}
/* 进度条：宽度在渲染时写死、没有可动的状态，所以不挂过渡。
   （声明一个永远不会发生的过渡等于「声称有动效但其实没有」） */
.track{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.track > i{display:block;height:100%;border-radius:3px;background:var(--ok)}

/* ---- 构成条 ---- */
.comp{display:flex;flex-direction:column;gap:13px}
.comp .row{display:grid;grid-template-columns:74px minmax(0,1fr) 78px;gap:11px;align-items:center;font-size:12px}
.comp .bar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line)}
.comp .bar > i{display:block;height:100%}
.comp .bar > i.in{background:var(--accent)}
.comp .bar > i.out{background:#9DB6F7}
.comp .v{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);text-align:right}

/* ---- 事件流 ---- */
.evrow{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:12px}
.evrow:last-child{border-bottom:0}
.evrow time{color:var(--muted);font-family:var(--mono);font-size:11px}
.evrow .m{color:var(--ink-2)}

/* ---- 表格（统计/日志/设置） ---- */
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-weight:500;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  padding:0 10px 8px 0;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line-2);color:var(--ink-2)}
td.n,th.n{text-align:right;padding-right:16px;font-family:var(--mono)}
td:last-child,th:last-child{padding-right:0}
tr.hov{transition:background-color var(--dur-hover) ease}
@media (hover:hover) and (pointer:fine){ tr.hov:hover td{background:#FAF9F7} }
.hbar{height:5px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.hbar > i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--ink-2)}

/* ---- 服务页头 + 页签 ---- */
.svhead2{display:flex;align-items:center;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.svhead2 img{width:34px;height:34px;border-radius:var(--r-md)}
.svhead2 h2{font-size:16px;font-weight:600;letter-spacing:-.01em}
.svhead2 .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.svhead2 .acts{margin-left:auto;display:flex;align-items:center;gap:9px}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px solid var(--line);
  border-radius:var(--r-sm);font-size:12px;color:var(--ink-2);background:#fff;
  transition:border-color var(--dur-hover) ease, transform var(--dur-press) var(--ease-out)}
@media (hover:hover) and (pointer:fine){ .btn:hover{border-color:var(--muted-2)} }
.btn:active{transform:translateY(.5px)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:18px 0 22px}
.tabs button{padding:9px 15px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:color var(--dur-hover) ease}
@media (hover:hover) and (pointer:fine){ .tabs button:hover{color:var(--ink-2)} }
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.cfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,290px));gap:14px 22px;justify-content:start}
.cfg .f label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.cfg .f .inp{height:32px;border:1px solid var(--line);border-radius:var(--r-sm);display:flex;align-items:center;
  padding:0 10px;font-size:12px;background:#fff;color:var(--ink-2);font-family:var(--mono)}
.cfg .f .hint{font-size:10.5px;color:var(--muted-2);margin-top:5px}
.codeblk{background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;
  font-family:var(--mono);font-size:11.5px;color:var(--ink-2);white-space:pre;overflow:auto;line-height:1.75}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:12px}
.kv dt{color:var(--muted)} .kv dd{margin:0;color:var(--ink-2)} .kv code{font-family:var(--mono);font-size:11px}
.empty{padding:26px 0;color:var(--muted);font-size:12.5px;line-height:1.7}

/* ---- 底部信息带 ---- */
.foot{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:28px;border-top:1px solid var(--ink);padding-top:13px}
.foot h3{font-size:11px;letter-spacing:.02em;font-weight:600;margin-bottom:11px}
/* 可用模型：横排四项。做过一版 4 行表格，把 footer 顶到 268px、整页超出 1080，
   而它只是参考资料不是仪表数据 —— 压平后整页正好一屏。 */
.mrow2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.mrow2 .i{display:flex;flex-direction:column;gap:6px}
.mrow2 .t{display:flex;align-items:center;gap:7px;font-size:11.5px}
.mrow2 .t img{width:16px;height:16px;border-radius:4px}
.mrow2 .n{font-family:var(--mono);font-size:19px;letter-spacing:-.02em;line-height:1.1}
.mrow2 .n.zero{color:var(--muted-2)}
.mrow2 .s{font-size:10.5px;color:var(--muted);line-height:1.45}

/* ---- 自适应：1512 以下收成两栏，1180 以下单栏 ---- */
@media (max-width:1512px){
  .s7,.s5{grid-column:span 12}
  .s4,.s3{grid-column:span 6}
  .band{grid-template-columns:repeat(3,1fr)}
  .band .k:nth-child(3n){border-right:0}
  .svhead,.svrow{grid-template-columns:26px minmax(0,1.4fr) 78px 56px 56px 76px 56px 46px}
  .svhead .hide-md,.svrow .hide-md{display:none}
}
@media (max-width:1180px){
  .s3,.s4{grid-column:span 12}
  .band{grid-template-columns:repeat(2,1fr)}
  .band .k:nth-child(2n){border-right:0}
  .foot{grid-template-columns:1fr}
  .mrow2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .svhead{display:none}
  .svrow{grid-template-columns:26px minmax(0,1fr) 74px 44px}
  .svrow .hide-xs{display:none}
}
/* 减少动效：保留帮助理解的透明度与颜色变化，去掉所有位移与循环。
   （不是「全部归零」——淡入与颜色反馈仍然有助于理解状态变化） */
@media (prefers-reduced-motion: reduce){
  .view-enter{animation:none}
  .sw::after{transition:none}            /* 开关旋钮不做位移动画，直接跳到终态 */
  .btn:active{transform:none}
  .live i{animation:none}
  .crossline,.tip{transition:opacity 80ms linear}
}
</style>
</head>
<body>
<div class="rail">
  <span class="brand" id="brand"></span>
  <nav>
    <button class="ni" data-nav="ov" title="总览" id="ni-ov"></button>
    <button class="ni" data-nav="svc" title="服务" id="ni-svc"></button>
    <button class="ni" data-nav="stats" title="统计" id="ni-stats"></button>
    <button class="ni" data-nav="logs" title="日志" id="ni-logs"></button>
    <button class="ni" data-nav="set" title="设置" id="ni-set"></button>
  </nav>
  <div class="svcs" id="railSvcs"></div>
</div>
<div class="top">
  <h1 id="ttl">总览</h1><span class="sep"></span><span class="meta" id="sub"></span>
  <div class="right">
    <span class="live"><i></i>状态 3s · 统计 60s</span>
    <span id="tog"></span>
  </div>
</div>
<div class="stage"><div class="wrap" id="view"></div></div>

<script src="assets/data.js"></script>
<script src="assets/sample.js"></script>
<script src="assets/logos.js"></script>
<script src="assets/logo-inner.js"></script>
<script src="assets/app.js"></script>
<script>
const D = window.DATA, SVC = D.services;
const tok = fmt.tok, int = fmt.int;
const $ = s => document.querySelector(s);
const SERIES_ALL = () => chartSeries();

document.getElementById('brand').innerHTML =
  `<svg viewBox="0 0 32 32" fill="currentColor" stroke="currentColor" stroke-linejoin="miter">${window.LOGO_INNER}</svg>`;
[['ni-ov','grid'],['ni-svc','server'],['ni-stats','bars'],['ni-logs','lines'],['ni-set','sliders']]
  .forEach(([id,icn]) => document.getElementById(id).innerHTML = ic(icn,18));
$('#tog').innerHTML = toggleChartHTML();
$('#railSvcs').innerHTML = SVC.map(s =>
  `<a href="#svc" class="${s.status==='running'?'':'off'}" title="${s.name} · :${s.port}" data-jump="${s.id}">${svcLogo(s.id,22)}</a>`).join('');

/* 服务色（与数据台的分类色同源，用于构成条与迷你图） */
const C = window.SVC_COLOR;

/* ---------------- 派生量（全部由真实快照算出，不新造数据） ---------------- */
const IN_OUT = D.summary.todayOut ? (D.summary.todayIn / D.summary.todayOut) : null;
const T30 = ['cline','workbuddy','qoder','cmdgo'].reduce((a,k)=>{const t=D.totals30[k]||{};
  a.tok += (t.input||0)+(t.output||0); a.reqs += (t.reqs||0); return a;}, {tok:0, reqs:0});
const PREV = D.summary.prevTok || 0;   /* 10-06 的合计，快照里已算好 */

/* ---------------- 图表：按容器实测宽度绘制 ---------------- */
/* 趋势图：含悬停读数（鼠标移入显示该日分服务明细） */
let trendGeo = null;
autoChart('[data-chart="trend"]', (W,H)=>{
  const series = SERIES_ALL();
  const pad={l:44,r:16,t:16,b:24};
  const split = chartMode()==='split';
  const max = Math.max(1, ...series.map(d=>d.tok));
  const X = i => pad.l + (i/(series.length-1))*(W-pad.l-pad.r);
  const Y = v => H-pad.b - (v/max)*(H-pad.t-pad.b);
  const pts = series.map((d,i)=>[X(i),Y(d.tok)]);
  const si = series.findIndex(d=>d.reqs>0);
  const ticks = [0,.5,1];
  const head = split
    ? ['cline','workbuddy','qoder','cmdgo'].map(k=>{
        const p = series.map((d,i)=>[X(i),Y(d.by[k]||0)]);
        return `<path d="${ch.line(p)}" fill="none" stroke="${C[k]}" stroke-width="1.5" stroke-linejoin="round"/>`; }).join('')
    : `<path d="${ch.area(pts,H-pad.b)}" fill="${C.cline}" opacity=".08"/>
       <path d="${ch.line(pts)}" fill="none" stroke="#16181A" stroke-width="1.4" stroke-linejoin="round"/>
       ${series.map((d,i)=>d.reqs?`<circle cx="${X(i)}" cy="${Y(d.tok)}" r="2.6" fill="#16181A"/>`:'').join('')}`;
  trendGeo = { X, Y, series, pad, W, H };
  queueMicrotask(bindTrendHover);   // 画完即绑，避免在 paintCharts 之前绑定时 trendGeo 还是空的
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
    ${ticks.map(f=>`<line x1="${pad.l}" x2="${W-pad.r}" y1="${Y(max*f)}" y2="${Y(max*f)}" stroke="#EFEDEA" stroke-dasharray="2 3"/>
      <text class="axis" x="${pad.l-8}" y="${Y(max*f)+3.5}" text-anchor="end">${tok(max*f)}</text>`).join('')}
    ${si>0?`<line x1="${X(si)}" x2="${X(si)}" y1="${pad.t-2}" y2="${H-pad.b}" stroke="#C9C5BF" stroke-dasharray="3 3"/>
      <text class="axis" x="${X(si)+5}" y="${pad.t+6}">记录起点</text>`:''}
    ${head}
    <text class="axis" x="${pad.l}" y="${H-6}">${series[0].full}</text>
    <text class="axis" x="${W-pad.r}" y="${H-6}" text-anchor="end">${series[series.length-1].full}</text>
  </svg>`;
});
/* 每服务 30 天迷你趋势（真实逐日）。
   曾在 104px 的格子里画 31 根柱（每根 1.35px），细到读不出趋势；
   阶梯面积在这个尺寸下才能一眼看出「一直是 0、最后两天起来」。 */
autoChart('[data-chart="spark"]', (W,H,el)=>{
  const series = SERIES_ALL(), id = el.dataset.svc;
  const vals = series.map(d=>d.by[id]||0);
  const max = Math.max(1,...vals);
  const n = vals.length, step = W/Math.max(1,n);
  const y = v => (H-2) - (v/max)*(H-6);
  // 阶梯折线，末尾回落到基线闭合成面积
  let line = `M0 ${y(vals[0]).toFixed(1)}`;
  vals.forEach((v,i)=>{ const x0=(i*step).toFixed(1), x1=((i+1)*step).toFixed(1), yy=y(v).toFixed(1);
    line += `L${x0} ${yy}L${x1} ${yy}`; });
  const zero = max<=1;   // 该服务 30 天完全没用量
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
    <path d="${line}L${W} ${H}L0 ${H}Z" fill="${zero?'#EDEBE8':C[id]}" opacity="${zero?1:.32}"/>
    <path d="${line}" fill="none" stroke="${zero?'#DDDAD5':C[id]}" stroke-width="1.4" stroke-linejoin="round"/>
  </svg>`;
});

/* 趋势图悬停读数：跟随鼠标，全部用 transform / opacity */
function bindTrendHover(){
  const box = document.querySelector('[data-chart="trend"]');
  const wrap = box && box.closest('.chartwrap');
  if (!box || !wrap || !trendGeo) return;
  const line = wrap.querySelector('.crossline'), tip = wrap.querySelector('.tip');
  if (!line || !tip || wrap._hb) return;
  wrap._hb = 1;
  wrap.addEventListener('mousemove', (e)=>{
    const r = box.getBoundingClientRect();
    const x = e.clientX - r.left;
    const { X, series, pad, W } = trendGeo;
    let best = 0, bd = 1e9;
    series.forEach((d,i)=>{ const dd = Math.abs(X(i)-x); if (dd<bd){bd=dd; best=i;} });
    const d = series[best], px = X(best);
    line.style.transform = `translateX(${px}px)`;
    line.style.opacity = '1';
    tip.style.transform = `translateX(${Math.min(Math.max(px+12,0), W-190)}px)`;
    tip.style.opacity = '1';
    tip.innerHTML = `<div class="d">${d.full} · ${d.reqs} 次请求</div>` +
      ['cline','workbuddy','qoder','cmdgo'].filter(k=>d.by[k]>0).map(k=>
        `<div class="r"><i style="background:${C[k]}"></i>${SVC.find(s=>s.id===k).short}<b>${tok(d.by[k])}</b></div>`).join('') +
      `<div class="r" style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px">合计<b>${tok(d.tok)}</b></div>`;
  });
  wrap.addEventListener('mouseleave', ()=>{ line.style.opacity='0'; tip.style.opacity='0'; });
}

  /* 视图进入：避免内容瞬移。150ms、只做透明度 + 3px；reduce 下自动关闭。 */
  view.classList.remove('view-enter'); void view.offsetWidth; view.classList.add('view-enter');
  view.querySelectorAll('[data-tab]').forEach(b=>{ if(!b._b){b._b=1;b.addEventListener('click',()=>{curTab=b.dataset.tab;window.__go()})} });
  view.querySelectorAll('[data-jsvc]').forEach(r=>{
    const open = ()=>{ curSvc=r.dataset.jsvc; curTab='acct'; location.hash='svc'; };
    if(!r._b){ r._b=1; r.addEventListener('click',open);
      r.addEventListener('keydown',(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } }); }
  });
  const st = document.getElementById('splitTog');
  if (st && !st._b){ st._b = 1; st.addEventListener('click',(e)=>{
    const v = e.target.dataset.split; if (v==null) return;
    setChartMode(v==='1' ? 'split' : 'real');
  }); }
  view.querySelectorAll('[data-jump]').forEach(a=>{ if(!a._b){a._b=1;a.addEventListener('click',()=>{curSvc=a.dataset.jump;curTab='acct'})} });
});
window.addEventListener('chartmode',()=>window.__go());
</script>
</body>
</html>
