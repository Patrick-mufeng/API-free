<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>面板 logo · 梯子 A 细化</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
  :root{ --ink:#16181A; --line:#E6E4E0; --muted:#6E6B66; }
  *{box-sizing:border-box}
  body{margin:0;padding:40px 44px 64px;background:#F4F3F1;color:var(--ink);
       font:400 13px/1.6 var(--font-sans);-webkit-font-smoothing:antialiased}
  h1{font-size:19px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
  .lede{color:var(--muted);margin:0 0 32px;max-width:82ch}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .cand{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .cand.pick{outline:2px solid #2E64F0;outline-offset:-2px}
  .cand h2{margin:0;padding:13px 15px 11px;font-size:12.5px;font-weight:600;
           border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
  .cand h2 em{font-style:normal;font-weight:400;font-size:11px;color:var(--muted)}
  .cand p{margin:0;padding:11px 15px 0;font-size:11.5px;color:var(--muted);line-height:1.6}
  .row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:15px;border-bottom:1px dashed #EFEDEA}
  .row:last-child{border-bottom:0}
  .row.dark{background:#14161A;border-bottom-color:#22252B}
  .cap{font-size:10.5px;color:var(--muted)} .row.dark .cap{color:#8B9099}
  .sizes{display:flex;align-items:flex-end;gap:16px}
  .sz{display:flex;flex-direction:column;align-items:center;gap:5px}
  .sz i{font-style:normal;font-size:9px;color:var(--muted)}
  .tile{display:inline-flex;align-items:center;justify-content:center;border-radius:22%;
        background:linear-gradient(145deg,#2E64F0,#12B5C9);box-shadow:0 2px 6px rgba(18,24,40,.22)}
  svg.mark{display:block;color:var(--ink)}
  .row.dark svg.mark{color:#F2F3F5}
  .wordmark{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px;letter-spacing:-.012em}
  .wordmark small{font-weight:400;font-size:10.5px;color:var(--muted);letter-spacing:0}
</style>
</head>
<body>
<h1>梯子 A · 细化（含上一轮 l-b 作对照）</h1>
<p class="lede">只调四件事：顶点怎么收（交叉 / 单点 / 平切）、脚底是圆头还是平切、横档数（2 或 3）、轨距。目标是 128px 有细节、24px 仍看得出「两把梯子」、16px 是一个干净的 A。</p>
<div class="grid" id="grid"></div>
<script>
const f = n => +n.toFixed(2);
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
const mul=(a,k)=>[a[0]*k,a[1]*k], norm=a=>{const l=Math.hypot(a[0],a[1]);return [a[0]/l,a[1]/l]}, perp=a=>[a[1],-a[0]];
function seg(p,q,w,cap='round'){return `<path d="M${f(p[0])} ${f(p[1])}L${f(q[0])} ${f(q[1])}" stroke="currentColor" stroke-width="${w}" stroke-linecap="${cap}" fill="none"/>`}
/* 梯子: top->bottom 中心线 */
function ladder(top,bottom,halfW,railW,rungTs,rungW,{t0=0,t1=1,cap='round',feetCap}=null){
  const o={t0,t1,cap}; const u=norm(sub(bottom,top)), p=perp(u);
  const at=t=>add(top,mul(sub(bottom,top),t));
  const A=add(at(o.t0),mul(p,halfW)),  B=add(at(1),mul(p,halfW));
  const C=add(at(o.t0),mul(p,-halfW)), D=add(at(1),mul(p,-halfW));
  let s = seg(A,B,railW,o.cap) + seg(C,D,railW,o.cap);
  for(const t of rungTs){ const c=at(t); s += seg(add(c,mul(p,-halfW)),add(c,mul(p,halfW)),rungW,'butt') }
  return s;
}
const mir=p=>[32-p[0],p[1]];
const feet=(L,R,w)=>seg(L,R,w,'butt');   // 基线（可选：把两脚连起来不画，仅用于切脚）

// 变体
function build(cfg){
  const top=P=>P;
  const T = cfg.top, FL = cfg.footL, FR = mir(FL);
  // 脚：若 flat，则在脚端补一条平切线（用 butt cap 的轨即可近似；这里直接改 cap）
  const opt = { t0: cfg.t0, t1: 1, cap: cfg.flatFeet ? 'butt' : 'round' };
  let s = ladder(T, FL, cfg.halfW, cfg.railW, cfg.rungs, cfg.rungW, opt)
        + ladder(T, FR, cfg.halfW, cfg.railW, cfg.rungs, cfg.rungW, opt);
  if (cfg.apexFlat){
    const u=norm(sub(FL,T)), p=perp(u);
    s += seg(add(T,mul(p,-cfg.halfW-1.0)), add(T,mul(p,cfg.halfW+1.0)), cfg.railW+0.4, 'butt');
  }
  if (cfg.extraBar) s += `<rect x="${cfg.extraBar[0]}" y="${cfg.extraBar[1]}" width="${cfg.extraBar[2]}" height="${cfg.extraBar[3]}" rx="${cfg.extraBar[3]/2}" fill="currentColor"/>`;
  return s;
}
const V = [
  { key:'ctl-l-b', name:'对照 l-b（圆脚 · 交叉顶）', ctl:true,
    note:'上一轮选中的那稿，原样保留。',
    cfg:{ top:[16,4.4], footL:[6.8,27.5], halfW:2.5, railW:2.3, rungW:2.2, rungs:[0.34,0.70], t0:0.05 } },
  { key:'flat-feet', name:'平切脚底',
    note:'脚底改为平切——梯子立在地上，而不是两根圆头棍子戳着。',
    cfg:{ top:[16,4.4], footL:[6.8,27.6], halfW:2.5, railW:2.3, rungW:2.2, rungs:[0.34,0.70], t0:0.05, flatFeet:true } },
  { key:'flat-ap', name:'平切脚底 + 顶点平切',
    note:'顶点用一小段横向平切把两梯顶部封住，形成 A 的平头；交叉噪声被盖掉。',
    cfg:{ top:[16,4.0], footL:[6.8,27.6], halfW:2.5, railW:2.3, rungW:2.2, rungs:[0.34,0.70], t0:0.04, flatFeet:true, apexFlat:true } },
  { key:'three-rung', name:'三档（中档对齐成横杠）',
    note:'每梯 3 档，中间那一档对齐成横杠，上下两档保留梯子感。',
    cfg:{ top:[16,4.2], footL:[6.6,27.6], halfW:2.5, railW:2.3, rungW:2.1, rungs:[0.22,0.52,0.80], t0:0.04, flatFeet:true } },
  { key:'wide', name:'轨距加宽 + 平切脚',
    note:'轨距 2.5→2.9，梯子更"透"、更像梯子；两梯之间也随之变窄。',
    cfg:{ top:[16,4.4], footL:[6.4,27.6], halfW:2.9, railW:2.2, rungW:2.2, rungs:[0.34,0.70], t0:0.05, flatFeet:true } },
  { key:'bar-plus', name:'平切脚 + 独立横杠',
    note:'在平切脚稿基础上，另加一根独立横杠（不与梯子相连），结构更"建筑"。',
    cfg:{ top:[16,4.4], footL:[6.8,27.6], halfW:2.5, railW:2.3, rungW:2.2, rungs:[0.30,0.72], t0:0.05, flatFeet:true, extraBar:[8.5,19.6,15,2.5] } },
];
const mark=(v,px)=>`<svg class="mark" width="${px}" height="${px}" viewBox="0 0 32 32" aria-hidden="true">${build(v.cfg)}</svg>`;
const onTile=(v,px)=>`<span class="tile" style="width:${px}px;height:${px}px">${mark(v,Math.round(px*0.66))}</span>`;
document.getElementById('grid').innerHTML = V.map(v=>`
  <section class="cand${v.ctl?' pick':''}">
    <h2><span>${v.name}</span><em>${v.key}</em></h2>
    <p>${v.note}</p>
    <div class="row"><div class="sizes">${[128,96,40,24,16].map(p=>`<span class="sz">${mark(v,p)}<i>${p}</i></span>`).join('')}</div></div>
    <div class="row">${onTile(v,64)}${onTile(v,40)}${onTile(v,24)}</div>
    <div class="row dark">${mark(v,40)}${mark(v,24)}${mark(v,16)}</div>
    <div class="row"><div class="wordmark">${mark(v,24)}<span>API-free<small>&nbsp;统一面板</small></span></div></div>
  </section>`).join('');
</script>
</body>
</html>
