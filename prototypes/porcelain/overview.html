<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>总览 · API-free</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="wrap">

  <div class="alertbar"><span class="ico"></span><span><b>2 个模型冷却中</b>：glm-5.2 预计 16:42 恢复 · deepseek-v3.2 预计 16:58 恢复</span></div>

  <div class="kpis">
    <div class="kpi"><h3>今日 Tokens</h3><div class="v" id="kTok">813.9万</div><div class="d up">较昨日 +12.4%</div></div>
    <div class="kpi"><h3>今日请求</h3><div class="v">1,189</div><div class="d up">较昨日 +38</div></div>
    <div class="kpi"><h3>活跃服务</h3><div class="v" id="kAct">3 / 4</div><div class="d">cmdgo-bridge 已停止</div></div>
    <div class="kpi"><h3>冷却中模型</h3><div class="v">2</div><div class="d">workbuddy · qoder</div></div>
  </div>

  <div class="sect">
    <div class="sect-head">
      <h3>用量趋势</h3><span class="sub">近 30 天 · 每日 Tokens · 四服务合计</span>
      <span class="sp"></span>
      <div class="legend" id="ovLegend" style="display:flex;gap:14px;font-size:12px;color:var(--muted)"></div>
      <div class="seg" id="ovSeg"><button class="on" data-m="all">全部</button><button data-m="split">按服务分线</button></div>
    </div>
    <div class="chartbox"><svg id="ovChart" viewBox="0 0 1000 230" preserveAspectRatio="none"></svg><div class="chart-tip" id="ovTip"></div></div>
  </div>

  <div class="sect">
    <div class="sect-head"><h3>服务状态</h3><span class="sub">进程监督 · 真·启停</span></div>
    <div class="tbox"><table>
      <thead><tr><th style="width:190px">服务</th><th style="width:110px">状态</th><th class="num-r" style="width:130px">今日 Tokens</th><th class="num-r" style="width:100px">今日请求</th><th style="width:110px">开关</th><th style="width:110px"></th></tr></thead>
      <tbody id="svcBody"></tbody>
    </table></div>
  </div>

  <div class="sect">
    <div class="sect-head"><h3>最近请求</h3><span class="sub">跨服务流水 · 最近 8 条</span><span class="sp"></span><span class="sub">16:03:41 更新</span></div>
    <div class="tbox"><table>
      <thead><tr><th style="width:90px">时间</th><th style="width:110px">服务</th><th>模型</th><th class="num-r" style="width:70px">状态</th><th class="num-r" style="width:90px">耗时</th><th class="num-r" style="width:100px">Tokens</th></tr></thead>
      <tbody id="recentBody"></tbody>
    </table></div>
  </div>

</div>
<style>
.enterlink{font-size:12.5px;font-weight:550;color:var(--text);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .15s ease-out}
.enterlink:hover{border-color:var(--text)}
</style>
<script src="app.js"></script>
<script>
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var SVC=[
  {id:'workbuddy',name:'WorkBuddy-free',port:7863,color:'#2f9e5f',status:'running',today:'311.9万',reqs:512},
  {id:'qoder',name:'Qoder-free',port:8210,color:'#3d6fd0',status:'running',today:'212.6万',reqs:386},
  {id:'cline',name:'Cline-free',port:8787,color:'#c07427',status:'running',today:'289.4万',reqs:291},
  {id:'cmdgo',name:'cmdgo-bridge',port:11435,color:'#cc4b44',status:'stopped',today:null,reqs:0}
];
var NAMES=['deepseek-v3.2','glm-5.2','claude-sonnet-4-5','gpt-5-codex','kimi-k2','gemini-3-flash'];
var DAYS=30;
function gen(seed,base,amp){var r=mulberry32(seed),out=[];for(var i=0;i<DAYS;i++){var wk=(i%7===5||i%7===6)?.55:1;out.push(Math.round((base+amp*r())*wk*(0.75+0.25*Math.sin(i/4))))}return out}
var SERIES={qoder:gen(11,520000,260000),workbuddy:gen(22,640000,300000),cline:gen(33,580000,240000),cmdgo:gen(44,180000,120000)};
function sumSeries(){var out=[];for(var i=0;i<DAYS;i++)out.push(SVC.reduce(function(a,s){return a+SERIES[s.id][i]},0));return out}
var ovSeries=SVC.map(function(s){return{name:s.name,color:s.color,data:SERIES[s.id]}});

function drawAll(){
  var lg=$('#ovLegend'); lg.innerHTML='<span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+SVC[0].color+';margin-right:5px"></i>全部服务</span>';
  chart($('#ovChart'),$('#ovTip'),[{name:'全部',color:SVC[0].color,data:sumSeries()}],'area',null,{reqData:sumSeries().map(function(v){return Math.round(v/1600)})});
}
function drawSplit(){
  var lg=$('#ovLegend'); lg.innerHTML=SVC.map(function(s){return '<span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+s.color+';margin-right:5px"></i>'+s.name+'</span>'}).join('');
  chart($('#ovChart'),$('#ovTip'),ovSeries,'split');
}
drawAll();
$('#ovSeg').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  this.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});
  b.dataset.m==='all'?drawAll():drawSplit();
});

/* 服务状态表 */
function renderSvcs(){
  $('#svcBody').innerHTML=SVC.map(function(s){
    var on=s.status!=='stopped';
    return '<tr data-id="'+s.id+'" class="'+(on?'':'dis-row')+'">'+
      '<td><b>'+s.name+'</b> <span class="muted" style="font-size:11.5px">:'+s.port+'</span></td>'+
      '<td><span class="st '+(s.status==='running'?'run':s.status==='booting'?'boot':'stop')+'"><i></i>'+(s._pending?s._pendingT:s.status==='running'?'运行中':s.status==='booting'?'启动中':'已停止')+'</span></td>'+
      '<td class="num-r">'+(on?s.today:'-')+'</td>'+
      '<td class="num-r">'+(on?fmtInt(s.reqs):'-')+'</td>'+
      '<td><button class="sw sm" role="switch" aria-checked="'+on+'" aria-label="'+s.name+' 开关" data-sw="'+s.id+'"'+(s._pending?' disabled':'')+'></button></td>'+
      '<td class="num-r"><a href="#" data-nav="service:'+s.id+'" class="enterlink">进入服务 →</a></td></tr>'+
      '<tr class="cf-tr" style="display:none"><td colspan="6" style="background:#fdf3f2;border-top:1px solid #f0d4d1;padding:8px 12px;font-size:12px;color:#9c3f39">停止后该服务的进行中请求会失败。 <button class="btn ghost xs" data-no>取消</button> <button class="btn dgr xs" data-yes>确认停止</button></td></tr>';
  }).join('');
}
renderSvcs();
$('#svcBody').addEventListener('click',function(e){
  var tr=e.target.closest('tr[data-id]');if(!tr)return;
  var id=tr.dataset.id,svc=SVC.find(function(s){return s.id===id});
  var cf=tr.nextElementSibling;
  if(e.target.closest('[data-no]')){cf.style.display='none';return}
  if(e.target.closest('[data-yes]')){
    cf.style.display='none';
    svc._pending=true;svc._pendingT='停止中…';renderSvcs();
    setTimeout(function(){svc.status='stopped';svc._pending=false;svc.today=null;svc.reqs=0;kpi();renderSvcs()},900);
    return;
  }
  if(e.target.closest('[data-sw]')){
    if(e.target.getAttribute('aria-checked')==='true'){cf.style.display='table-row'}
    else{
      svc._pending=true;svc._pendingT='启动中…';svc.status='booting';renderSvcs();
      setTimeout(function(){svc._pending=false;svc.status='running';svc.today=svc.id==='cmdgo'?'112.8万':svc.today;svc.reqs=svc.id==='cmdgo'?142:svc.reqs;kpi();renderSvcs()},1300);
    }
  }
});
function kpi(){
  var act=SVC.filter(function(s){return s.status!=='stopped'});
  $('#kTok').textContent=act.length===4?'847.3万':'813.9万';
  $('#kAct').textContent=act.length+' / 4';
}

/* 最近请求 */
var RECENT=[
  ['16:03:41','workbuddy','claude-sonnet-4-5',200,'2.31s','48,204'],
  ['16:03:12','cline','deepseek-v3.2',200,'1.02s','12,847'],
  ['16:02:58','qoder','kimi-k2',200,'0.84s','6,032'],
  ['16:02:31','workbuddy','glm-5.2',429,'0.12s','0'],
  ['16:02:07','cline','claude-sonnet-4-5',200,'3.14s','31,580'],
  ['16:01:44','workbuddy','gpt-5-codex',200,'2.62s','18,921'],
  ['16:01:20','qoder','deepseek-v3.2',200,'1.38s','9,410'],
  ['16:00:55','cline','glm-5.2',200,'0.96s','4,208']
];
$('#recentBody').innerHTML=RECENT.map(function(r){
  return '<tr><td>'+r[0]+'</td><td><span class="chip">'+r[1]+'</span></td><td class="m">'+r[2]+'</td>'+
  '<td class="num-r"><span class="code '+(r[3]===200?'s':'w')+'">'+r[3]+'</span></td><td class="num-r">'+r[4]+'</td><td class="num-r">'+r[5]+'</td></tr>';
}).join('');
</script>
</body>
</html>
