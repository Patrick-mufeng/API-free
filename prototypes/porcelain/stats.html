<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>统计 · API-free</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="wrap">
  <div class="pagehead"><h1>统计</h1><span class="sub">跨服务聚合 · 以各服务自身统计为准，聚合为面板拉取口径（每 5 分钟）</span></div>

  <div class="sect">
    <div class="sect-head">
      <h3>对比趋势</h3><span class="sub">四服务 Token · 近 30 天</span><span class="sp"></span>
      <div class="seg" id="stSeg"><button class="on" data-m="all">合计</button><button data-m="split">分线</button></div>
    </div>
    <div class="chartbox"><svg id="stChart" viewBox="0 0 1000 230" preserveAspectRatio="none"></svg><div class="chart-tip" id="stTip"></div></div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1.5fr;gap:44px" class="duo">
    <div class="sect">
      <div class="sect-head"><h3>服务占比</h3><span class="sub">30 天</span></div>
      <div class="rank" id="shareRank"></div>
    </div>
    <div class="sect">
      <div class="sect-head"><h3>模型 TOP 5</h3><span class="sub">跨服务同名合并</span></div>
      <div class="tbox"><table>
        <thead><tr><th>模型</th><th>来源</th><th class="num-r">Tokens</th><th class="num-r">请求数</th></tr></thead>
        <tbody id="modelTop"></tbody>
      </table></div>
    </div>
  </div>

  <div class="sect">
    <div class="sect-head"><h3>明细</h3><span class="sub">日期 × 服务 · 最近 6 天</span><span class="sp"></span><button class="btn xs" id="csvBtn">导出 CSV</button></div>
    <div class="tbox"><table>
      <thead><tr><th>日期</th><th>服务</th><th class="num-r">输入 tok</th><th class="num-r">输出 tok</th><th class="num-r">请求数</th></tr></thead>
      <tbody id="detailBody"></tbody>
    </table></div>
  </div>

  <p style="font-size:11.5px;color:var(--faint)">口径说明：各服务自身统计为准；cmdgo 为补丁口径（只读 /api/usage）。服务停止期间无数据，不记 0。</p>
</div>
<script src="app.js"></script>
<script>
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var SVC=[
  {id:'workbuddy',name:'WorkBuddy-free',port:7863,color:'#2f9e5f',status:'running'},
  {id:'qoder',name:'Qoder-free',port:8210,color:'#3d6fd0',status:'running'},
  {id:'cline',name:'Cline-free',port:8787,color:'#c07427',status:'running'},
  {id:'cmdgo',name:'cmdgo-bridge',port:11435,color:'#cc4b44',status:'stopped'}
];
var DAYS=30;
function gen(seed,base,amp){var r=mulberry32(seed),out=[];for(var i=0;i<DAYS;i++){var wk=(i%7===5||i%7===6)?.55:1;out.push(Math.round((base+amp*r())*wk*(0.75+0.25*Math.sin(i/4))))}return out}
var SERIES={qoder:gen(11,520000,260000),workbuddy:gen(22,640000,300000),cline:gen(33,580000,240000),cmdgo:gen(44,180000,120000)};
function sumSeries(){var out=[];for(var i=0;i<DAYS;i++)out.push(SVC.reduce(function(a,s){return a+SERIES[s.id][i]},0));return out}
var ovSeries=SVC.map(function(s){return{name:s.name,color:s.color,data:SERIES[s.id]}});
function drawAll(){chart($('#stChart'),$('#stTip'),[{name:'全部',color:SVC[0].color,data:sumSeries()}],'area')}
function drawSplit(){chart($('#stChart'),$('#stTip'),ovSeries,'split')}
drawAll();
$('#stSeg').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  this.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});
  b.dataset.m==='all'?drawAll():drawSplit();
});
var shareSum=sumSeries().reduce(function(a,b){return a+b},0);
$('#shareRank').innerHTML=SVC.map(function(s){
  var t=SERIES[s.id].reduce(function(a,b){return a+b},0),p=Math.round(t/shareSum*1000)/10;
  return '<div class="r"><div class="t"><b><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+s.color+';margin-right:7px"></i>'+s.name+'</b><span>'+p+'%</span></div><div class="bar"><i style="width:'+p+'%"></i></div></div>';
}).join('');
$('#modelTop').innerHTML=[
  ['deepseek-v3.2',['qoder','cline'],'312.4万',1204],
  ['glm-5.2',['workbuddy'],'187.2万',921],
  ['claude-sonnet-4-5',['cline','workbuddy'],'121.8万',412],
  ['gpt-5-codex',['workbuddy'],'96.5万',358],
  ['kimi-k2',['qoder'],'71.3万',301]
].map(function(m){
  return '<tr><td class="m">'+m[0]+'</td><td>'+m[1].map(function(s){return '<span class="chip">'+s+'</span>'}).join(' ')+'</td><td class="num-r">'+m[2]+'</td><td class="num-r">'+fmtInt(m[3])+'</td></tr>';
}).join('');
/* 明细：最近 6 天 × 4 服务 */
var rows=[];
for(var d=DAYS-6;d<DAYS;d++){
  SVC.forEach(function(s){rows.push([d,s])});
}
$('#detailBody').innerHTML=rows.map(function(r){
  var v=SERIES[r[1].id][r[0]];
  return '<tr><td>'+dayLabel(r[0],DAYS)+'</td><td><span class="chip">'+r[1].name+'</span></td>'+
  '<td class="num-r">'+fmtInt(Math.round(v*0.62))+'</td><td class="num-r">'+fmtInt(Math.round(v*0.38))+'</td><td class="num-r">'+fmtInt(Math.round(v/2600))+'</td></tr>';
}).join('');
$('#csvBtn').addEventListener('click',function(){toast('已导出明细 CSV（示例）','ok')});
</script>
</body>
</html>
